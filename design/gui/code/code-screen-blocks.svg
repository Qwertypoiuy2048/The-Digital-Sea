<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
  <title id="title">Program code screen with modular ability blocks</title>
  <desc id="desc">A 16:9 fullscreen program editor using a main program stack, colored modular code blocks, processing allocation controls, and extension sockets for movement and scan modules.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07151f"/><stop offset="0.55" stop-color="#0c1d29"/><stop offset="1" stop-color="#15172a"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#142b37" stop-opacity="0.97"/><stop offset="1" stop-color="#10202d" stop-opacity="0.97"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#6fd3d3" stroke-opacity="0.055"/></pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect id="code-screen-background" width="1440" height="810" fill="url(#background)"/>
  <rect id="code-editor-grid" x="286" y="126" width="858" height="560" fill="url(#grid)"/>

  <g id="customizable-info-bars" font-family="ui-monospace,monospace">
    <rect id="info-bar-storage" x="20" y="18" width="255" height="78" rx="8" fill="#102936" stroke="#318f96"/>
    <text x="36" y="42" fill="#8ee5df" font-size="13">STORAGE</text><text x="36" y="71" fill="#e1fffb" font-size="22">286 / 512 MB</text><rect x="155" y="34" width="100" height="7" rx="3" fill="#203d47"/><rect x="155" y="34" width="56" height="7" rx="3" fill="#3ed5c8"/>
    <rect id="info-bar-compute" x="290" y="18" width="255" height="78" rx="8" fill="#102936" stroke="#318f96"/>
    <text x="306" y="42" fill="#8ee5df" font-size="13">COMPUTE</text><text x="306" y="71" fill="#e1fffb" font-size="22">37 / 64 CU</text><rect x="425" y="34" width="100" height="7" rx="3" fill="#203d47"/><rect x="425" y="34" width="58" height="7" rx="3" fill="#5fb8ff"/>
    <rect id="info-bar-memory" x="560" y="18" width="255" height="78" rx="8" fill="#102936" stroke="#318f96"/>
    <text x="576" y="42" fill="#8ee5df" font-size="13">MEMORY</text><text x="576" y="71" fill="#e1fffb" font-size="22">18 / 32 MB</text><rect x="695" y="34" width="100" height="7" rx="3" fill="#203d47"/><rect x="695" y="34" width="56" height="7" rx="3" fill="#b78cff"/>
    <rect id="info-bar-cores" x="830" y="18" width="255" height="78" rx="8" fill="#102936" stroke="#318f96"/>
    <text x="846" y="42" fill="#8ee5df" font-size="13">CORES</text><text x="846" y="71" fill="#e1fffb" font-size="22">3 / 4 ACTIVE</text><rect x="965" y="34" width="100" height="7" rx="3" fill="#203d47"/><rect x="965" y="34" width="75" height="7" rx="3" fill="#f4bd67"/>
    <rect id="info-bar-customize" x="1100" y="18" width="320" height="78" rx="8" fill="#142c36" stroke="#4e8290" stroke-dasharray="5 5"/>
    <text x="1120" y="48" fill="#9edbd8" font-size="13">+ CUSTOMIZE INFO BARS</text><text x="1120" y="72" fill="#769ea5" font-size="12">drag, hide, or reorder telemetry</text>
  </g>

  <g id="saved-code-sidebar" font-family="ui-monospace,monospace">
    <rect x="20" y="126" width="248" height="560" rx="8" fill="url(#panel)" stroke="#35616d"/>
    <text x="38" y="157" fill="#e1fffb" font-size="17">SAVED CODE</text><text x="38" y="180" fill="#769ea5" font-size="12">drag modules or extensions</text>
    <rect id="code-sort-control" x="38" y="198" width="212" height="30" rx="5" fill="#1a3943" stroke="#477d86"/><text x="50" y="218" fill="#b8e7e5" font-size="12">SORT: COMPATIBILITY ▾</text>
    <path d="M39 260 l6 -6 l6 6 l-6 6z" fill="#50e4c4"/><text x="60" y="264" fill="#c8fff6" font-size="13">MODULES</text><text x="228" y="264" fill="#6ad9c4" font-size="12">3</text>
    <rect id="saved-code-movement" x="39" y="276" width="211" height="42" rx="5" fill="#193a43" stroke="#3bcbb8"/><circle cx="58" cy="297" r="8" fill="#3dded0"/><text x="77" y="301" fill="#e1fffb" font-size="12">MOVEMENT</text>
    <rect id="saved-code-scan" x="39" y="326" width="211" height="42" rx="5" fill="#193a43" stroke="#3bcbb8"/><circle cx="58" cy="347" r="8" fill="#3dded0"/><text x="77" y="351" fill="#e1fffb" font-size="12">SCAN</text>
    <rect id="saved-code-copy" x="39" y="376" width="211" height="42" rx="5" fill="#193a43" stroke="#3bcbb8"/><circle cx="58" cy="397" r="8" fill="#3dded0"/><text x="77" y="401" fill="#e1fffb" font-size="12">COPY DATA</text>
    <path d="M39 454 l6 -6 l6 6 l-6 6z" fill="#b78cff"/><text x="60" y="458" fill="#dcb4f5" font-size="13">EXTENSIONS</text><text x="228" y="458" fill="#bc7fe4" font-size="12">4</text>
    <rect id="saved-extension-pathing" x="39" y="470" width="211" height="36" rx="5" fill="#302a3e" stroke="#8a65aa"/><circle cx="58" cy="488" r="7" fill="#b77de0"/><text x="77" y="492" fill="#e5d6f2" font-size="12">PATHING</text>
    <rect id="saved-extension-burst" x="39" y="514" width="211" height="36" rx="5" fill="#302a3e" stroke="#8a65aa"/><circle cx="58" cy="532" r="7" fill="#b77de0"/><text x="77" y="536" fill="#e5d6f2" font-size="12">BURST TRANSMISSION</text>
    <rect id="saved-extension-deep-scan" x="39" y="558" width="211" height="36" rx="5" fill="#302a3e" stroke="#8a65aa"/><circle cx="58" cy="576" r="7" fill="#b77de0"/><text x="77" y="580" fill="#e5d6f2" font-size="12">DEEP SCAN</text>
    <rect id="saved-extension-passive-scan" x="39" y="602" width="211" height="36" rx="5" fill="#302a3e" stroke="#8a65aa"/><circle cx="58" cy="620" r="7" fill="#b77de0"/><text x="77" y="624" fill="#e5d6f2" font-size="12">PASSIVE SCAN</text>
  </g>

  <g id="main-program-stack" font-family="ui-monospace,monospace">
    <text x="306" y="157" fill="#e1fffb" font-size="17">MAIN PROGRAM</text><text x="306" y="180" fill="#769ea5" font-size="12">drag modules into the stack • add extensions to sockets</text>
    <rect id="compile-status" x="920" y="142" width="196" height="32" rx="5" fill="#273237" stroke="#b57b4c"/><circle cx="938" cy="158" r="6" fill="#e3a061"/><text x="951" y="162" fill="#f0cba9" font-size="12">COMPILING 62%</text>

    <rect id="main-program-container" x="330" y="215" width="790" height="450" rx="12" fill="#0c202b" fill-opacity="0.72" stroke="#416e79" stroke-width="2"/>
    <path id="main-program-spine" d="M390 284 V600" stroke="#39747a" stroke-width="5"/>
    <rect id="main-program-header" x="350" y="236" width="750" height="48" rx="8" fill="#23535b" stroke="#54e2d2" stroke-width="2"/><text x="375" y="266" fill="#e9fffb" font-size="15">PROGRAM INSTANCE // 01</text><circle cx="1072" cy="260" r="7" fill="#55e4c5"/><text x="980" y="266" fill="#9ce7df" font-size="12">RUNNING STACK</text>

    <!-- Movement module -->
    <g id="module-movement" transform="translate(420 305)">
      <rect width="570" height="92" rx="8" fill="#153a43" stroke="#52e1d1" stroke-width="2"/>
      <rect width="570" height="28" rx="8" fill="#1e545c"/><text x="18" y="19" fill="#e1fffb" font-size="13">MOVEMENT MODULE</text><circle cx="550" cy="14" r="6" fill="#55e4c5"/>
      <text x="18" y="54" fill="#8bd8d5" font-size="11">IN</text><circle cx="25" cy="69" r="7" fill="#50aab0"/><text x="45" y="73" fill="#bdeeed" font-size="11">destination / route</text>
      <text x="214" y="54" fill="#8bd8d5" font-size="11">OUT</text><circle cx="221" cy="69" r="7" fill="#50e0c8"/><text x="240" y="73" fill="#bdeeed" font-size="11">position / signal</text>
      <rect id="movement-extension-socket" x="370" y="42" width="176" height="34" rx="6" fill="#302a3e" stroke="#b77de0" stroke-width="2" stroke-dasharray="7 5"/><text x="458" y="64" text-anchor="middle" fill="#dcb4f5" font-size="11">+ EXTENSION: PATHING</text>
    </g>
    <rect id="movement-processing-control" x="420" y="402" width="570" height="28" rx="5" fill="#112b35" stroke="#38636d"/><text x="438" y="421" fill="#8ee5df" font-size="11">PROCESSING ALLOCATION</text><rect x="603" y="411" width="220" height="8" rx="4" fill="#263d45"/><rect x="603" y="411" width="132" height="8" rx="4" fill="#5fb8ff"/><text x="842" y="421" fill="#b9dfe0" font-size="11">12 CU / 20 CU</text><text x="1005" y="421" fill="#789da3" font-size="11">FREQUENCY: HIGH ▾</text>

    <!-- Scan module -->
    <g id="module-scan" transform="translate(420 458)">
      <rect width="570" height="92" rx="8" fill="#153a43" stroke="#52e1d1" stroke-width="2"/><rect width="570" height="28" rx="8" fill="#1e545c"/><text x="18" y="19" fill="#e1fffb" font-size="13">SCAN MODULE</text><circle cx="550" cy="14" r="6" fill="#55e4c5"/>
      <text x="18" y="54" fill="#8bd8d5" font-size="11">IN</text><circle cx="25" cy="69" r="7" fill="#50aab0"/><text x="45" y="73" fill="#bdeeed" font-size="11">nearby signal</text><text x="210" y="54" fill="#8bd8d5" font-size="11">OUT</text><circle cx="217" cy="69" r="7" fill="#50e0c8"/><text x="237" y="73" fill="#bdeeed" font-size="11">scan result</text>
      <rect id="scan-extension-socket" x="370" y="42" width="176" height="34" rx="6" fill="#302a3e" stroke="#b77de0" stroke-width="2" stroke-dasharray="7 5"/><text x="458" y="64" text-anchor="middle" fill="#dcb4f5" font-size="11">+ EXTENSION: DEEP SCAN</text>
    </g>
    <rect id="scan-processing-control" x="420" y="555" width="570" height="28" rx="5" fill="#112b35" stroke="#38636d"/><text x="438" y="574" fill="#8ee5df" font-size="11">PROCESSING ALLOCATION</text><rect x="603" y="564" width="220" height="8" rx="4" fill="#263d45"/><rect x="603" y="564" width="90" height="8" rx="4" fill="#5fb8ff"/><text x="842" y="574" fill="#b9dfe0" font-size="11">8 CU / 20 CU</text><text x="1005" y="574" fill="#789da3" font-size="11">FREQUENCY: NORMAL ▾</text>

    <rect id="main-program-drop-zone" x="420" y="604" width="570" height="38" rx="7" fill="#102832" stroke="#4e8791" stroke-width="2" stroke-dasharray="8 7"/><text x="705" y="628" text-anchor="middle" fill="#9ac8c9" font-size="12">DROP MODULE INTO MAIN PROGRAM</text>
  </g>

  <g id="working-stats-panel" font-family="ui-monospace,monospace">
    <rect x="1162" y="126" width="258" height="560" rx="8" fill="url(#panel)" stroke="#35616d"/><text x="1182" y="157" fill="#e1fffb" font-size="17">WORKING STATE</text><text x="1182" y="180" fill="#769ea5" font-size="12">updates as modules change</text>
    <text x="1182" y="222" fill="#8ee5df" font-size="12">ACTIVE ABILITIES</text><text x="1182" y="250" fill="#d5faf5" font-size="13">MOVEMENT</text><text x="1378" y="250" text-anchor="end" fill="#62e4c9" font-size="12">ACTIVE</text><text x="1182" y="278" fill="#d5faf5" font-size="13">SCAN</text><text x="1378" y="278" text-anchor="end" fill="#62e4c9" font-size="12">ACTIVE</text><text x="1182" y="306" fill="#d5faf5" font-size="13">COPY DATA</text><text x="1378" y="306" text-anchor="end" fill="#789da3" font-size="12">NOT LOADED</text>
    <text x="1182" y="350" fill="#8ee5df" font-size="12">RESULTING STATS</text><text x="1182" y="378" fill="#aac8cc" font-size="12">movement range</text><text x="1378" y="378" text-anchor="end" fill="#e1fffb" font-size="13">18 m</text><text x="1182" y="406" fill="#aac8cc" font-size="12">scan detail</text><text x="1378" y="406" text-anchor="end" fill="#e1fffb" font-size="13">basic + deep</text><text x="1182" y="434" fill="#aac8cc" font-size="12">scan frequency</text><text x="1378" y="434" text-anchor="end" fill="#e1fffb" font-size="13">normal</text><text x="1182" y="462" fill="#aac8cc" font-size="12">compile state</text><text x="1378" y="462" text-anchor="end" fill="#d99b67" font-size="13">62%</text>
    <line x1="1182" y1="490" x2="1400" y2="490" stroke="#365762"/><text x="1182" y="521" fill="#8ee5df" font-size="12">PROCESSING SUMMARY</text><text x="1182" y="551" fill="#aac8cc" font-size="12">movement</text><text x="1378" y="551" text-anchor="end" fill="#5fb8ff" font-size="12">12 CU</text><text x="1182" y="578" fill="#aac8cc" font-size="12">scan</text><text x="1378" y="578" text-anchor="end" fill="#5fb8ff" font-size="12">8 CU</text><text x="1182" y="605" fill="#aac8cc" font-size="12">available</text><text x="1378" y="605" text-anchor="end" fill="#62e4c9" font-size="12">17 CU</text>
  </g>

  <g id="code-screen-footer" font-family="ui-monospace,monospace"><text x="20" y="750" fill="#83b8ba" font-size="12">CODE ARCHITECTURE // MODULAR PROGRAM</text><text x="1420" y="750" text-anchor="end" fill="#658b93" font-size="12">DRAG TO ADD  ·  PLUG IN EXTENSIONS  ·  ALLOCATE PROCESSING  ·  COMPILE TO APPLY</text></g>
</svg>
